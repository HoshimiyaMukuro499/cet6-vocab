<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>单词本</title>
<style>
  :root {
    --bg: #f2f3f5;
    --bar: #ffffff;
    --fg: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --page-shadow: 0 1px 4px rgba(0,0,0,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --bar: #1f2937;
      --fg: #f3f4f6;
      --muted: #9ca3af;
      --line: #374151;
      --accent: #60a5fa;
      --page-shadow: 0 1px 6px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    /* dvh 而非 vh：移动端地址栏收起/展开时不会跳动 */
    height: 100dvh;
  }

  /* ── 顶部固定工具条 ──────────────────────────────────────────
     必须在顶部而非页底：PDF 渲染失败时，下载按钮就是唯一的出路。 */
  header {
    flex: 0 0 auto;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top));
    z-index: 10;
  }

  .title { font-size: 16px; font-weight: 600; }

  .stamp {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .actions a {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;              /* 触摸目标不小于 44px */
    padding: 0 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid var(--line);
    color: var(--fg);
    -webkit-tap-highlight-color: transparent;
  }

  .actions a.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .actions a:active { opacity: .7; }

  /* ── 页面渲染区 ────────────────────────────────────────────── */
  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;                  /* 关键：不加这行 flex 子项不会收缩，会撑破布局 */
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
  }

  .page {
    display: block;
    margin: 0 auto 10px;
    background: #fff;               /* PDF 页面本身是白的，深色模式下也是 */
    box-shadow: var(--page-shadow);
    border-radius: 2px;
  }

  /* 加载中 / 出错时的提示层 */
  .status {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 60vh;
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
  }

  .status .hint { font-size: 13px; }

  .spinner {
    width: 26px;
    height: 26px;
    border: 2.5px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .status.error .spinner { display: none; }
</style>
</head>
<body>

<header>
  <div class="title">单词本</div>
  <div class="stamp" id="stamp">正在读取版本…</div>
  <div class="actions">
    <a class="primary" id="dl-pdf" download>下载 PDF</a>
    <a id="dl-docx" download>下载 Word</a>
  </div>
</header>

<div class="stage" id="stage">
  <div class="status" id="status">
    <div class="spinner"></div>
    <div>正在加载…</div>
  </div>
  <div id="pages"></div>
</div>

<!-- ── 保命脚本：必须是普通脚本，不能并进下面的 module ──────────────
     模块一旦 import 失败（比如服务器给 .mjs 返回了错误的 MIME 类型，
     浏览器会直接拒绝加载），整段模块代码一行都不会执行。
     而「下载按钮能用 + 出错时给个提示」恰恰是那一刻唯一能救场的东西，
     所以它们必须跑在模块之外。 -->
<script>
(function () {
  'use strict';

  var FILES = { pdf: '单词本.pdf', docx: '单词本.docx' };
  // 中文文件名必须编码后再拼进 URL
  var URLS = {
    pdf:  encodeURIComponent(FILES.pdf),
    docx: encodeURIComponent(FILES.docx)
  };

  var stampEl  = document.getElementById('stamp');
  var pagesEl  = document.getElementById('pages');
  var statusEl = document.getElementById('status');
  var dlPdf    = document.getElementById('dl-pdf');
  var dlDocx   = document.getElementById('dl-docx');

  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  function dateTag(d) {
    if (!d || isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function fmtTime(d) {
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // ?t= 时间戳强制绕过浏览器与 CDN 缓存，确保每次都拿到最新一份
  var stamp   = Date.now();
  var pdfUrl  = URLS.pdf  + '?t=' + stamp;
  var docxUrl = URLS.docx + '?t=' + stamp;

  // 先把链接挂上。无论后面渲染成不成功，这两个按钮都必须能用——
  // 渲染挂了的时候，下载就是唯一的出路。
  dlPdf.href  = pdfUrl;
  dlDocx.href = docxUrl;

  var errorShown = false;
  function showError(msg) {
    errorShown = true;
    statusEl.className = 'status error';
    statusEl.innerHTML =
      '<div>无法显示文档内容</div>' +
      '<div class="hint">' + msg + '</div>' +
      '<div class="hint">请点上方「下载 PDF」，用 WPS 等应用打开</div>';
    statusEl.style.display = '';
  }
  window.showError = showError;

  // 用 HEAD 读 Last-Modified，确认当前看到的是不是最新版（同源请求才能读到该响应头）
  fetch(pdfUrl, { method: 'HEAD', cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.headers.get('last-modified');
    })
    .then(function (lm) {
      var d = lm ? new Date(lm) : null;
      stampEl.textContent = (d && !isNaN(d.getTime()))
        ? '更新于 ' + fmtTime(d)
        : '已是最新版本';
      var tag = dateTag(d);
      dlPdf.setAttribute('download',  '单词本' + (tag ? '-' + tag : '') + '.pdf');
      dlDocx.setAttribute('download', '单词本' + (tag ? '-' + tag : '') + '.docx');
    })
    .catch(function () {
      stampEl.textContent = '无法读取版本时间';
      dlPdf.setAttribute('download', '单词本.pdf');
      dlDocx.setAttribute('download', '单词本.docx');
    });

  // ── 看门狗 ──────────────────────────────────────────────────
  // 兜住「下面的模块压根没跑起来」以及解析卡死、内存不足等静默失败。
  // 没有这层兜底，页面会永远停在「正在加载…」，而用户看不到任何原因。
  var WATCHDOG_MS = 20000;

  setTimeout(function checkStuck() {
    if (errorShown) return;                      // 已经报过错了，不要覆盖
    if (pagesEl.childElementCount > 0) return;   // 已经画出来了，一切正常

    // 切到后台时浏览器不跑 requestAnimationFrame，渲染本来就会暂停，
    // 这不是故障。等回到前台再判断，避免误报。
    if (document.visibilityState !== 'visible') {
      setTimeout(checkStuck, WATCHDOG_MS);
      return;
    }

    showError('加载超时。可能是浏览器版本过旧，或网络太慢。');
  }, WATCHDOG_MS);
})();
</script>

<script type="module">
// vendor/ 里放的是 pdfjs-dist 6.3.289 的 **legacy** 构建，不要换成常规构建。
// 常规构建依赖 Uint8Array.prototype.toHex 等很新的 JS 特性（Chrome 140+），
// 手机上较旧的浏览器会直接报 "toHex is not a function" 而白屏。
// legacy 构建把它转译/兜底掉了，兼容性广得多，代价只是文件大几十 KB。
//
// 文件扩展名用 .js 而不是 .mjs：ES 模块的身份由 import 决定，与扩展名无关，
// 但 .mjs 在部分服务器/CDN 上 Content-Type 处理不一致，浏览器会拒绝加载。
import * as pdfjsLib from './vendor/pdf.min.js';

pdfjsLib.GlobalWorkerOptions.workerSrc =
  new URL('./vendor/pdf.worker.min.js', import.meta.url).href;

// 下载链接、更新时间、出错提示都由上面那个普通脚本负责，这里只管渲染。
const stage    = document.getElementById('stage');
const pagesEl  = document.getElementById('pages');
const statusEl = document.getElementById('status');
const showError = window.showError;

const pdfUrl = encodeURIComponent('单词本.pdf') + '?t=' + Date.now();

// ── 渲染 PDF ──────────────────────────────────────────────────
// 手机上没有浏览器内嵌的 PDF 阅读器，所以用 pdf.js 把每页画到 canvas 上。
// 顺带解决了自适应：每页按容器宽度重新计算缩放，手机上不用左右拖。

let doc = null;
let generation = 0;        // 防止旋转屏幕时的重入渲染互相打架
let rendering = false;

async function renderAll() {
  const myGen = ++generation;
  const width = stage.clientWidth - 16;          // 两侧各留 8px
  if (width <= 0) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);   // 上限 2，避免高分屏上内存爆掉

  pagesEl.textContent = '';

  for (let n = 1; n <= doc.numPages; n++) {
    if (myGen !== generation) return;            // 已被新的一轮渲染取代，放弃本次

    const page = await doc.getPage(n);
    const base = page.getViewport({ scale: 1 });
    const scale = width / base.width;
    const viewport = page.getViewport({ scale });

    const canvas = document.createElement('canvas');
    canvas.className = 'page';
    canvas.width  = Math.floor(viewport.width  * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width  = Math.floor(viewport.width)  + 'px';
    canvas.style.height = Math.floor(viewport.height) + 'px';

    const ctx = canvas.getContext('2d');
    if (dpr !== 1) ctx.scale(dpr, dpr);

    await page.render({ canvasContext: ctx, viewport }).promise;
    if (myGen !== generation) return;

    pagesEl.appendChild(canvas);
    if (n === 1) statusEl.style.display = 'none';   // 第一页出来就撤掉加载提示
  }
}

(async () => {
  try {
    doc = await pdfjsLib.getDocument({ url: pdfUrl }).promise;
    await renderAll();
    if (pagesEl.childElementCount === 0) {
      showError('文档没有可显示的页面。');
    }
  } catch (err) {
    showError('错误信息：' + (err && err.message ? err.message : String(err)));
  }
})();

// 旋屏 / 改窗口大小时按新宽度重排。防抖 + 串行化，
// 避免连发多次重渲染把手机卡住。
let resizeTimer = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(async () => {
    if (!doc || rendering) return;
    rendering = true;
    try { await renderAll(); } catch (e) { showError(String(e)); }
    finally { rendering = false; }
  }, 250);
}

window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
</script>

</body>
</html>
